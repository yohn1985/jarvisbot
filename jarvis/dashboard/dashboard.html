<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Jarvis</title>
<style>
  :root{ --bg:#0c0f0d; --panel:#11150f; --line:#1d2a1d; --txt:#c8d6c4; --dim:#6f7e6b;
         --grn:#3fae5a; --grnpill:#16301c; --grntxt:#7fe39a; --amber:#d8a13a; --red:#d85a5a; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--txt); font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  header{ display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-bottom:1px solid var(--line); }
  header .title{ letter-spacing:2px; color:var(--grntxt); font-weight:600; }
  header .meta{ color:var(--dim); }
  nav{ display:flex; gap:4px; padding:8px 18px 0; }
  nav button{ background:none; border:none; color:var(--dim); padding:8px 14px; cursor:pointer; letter-spacing:1px; border-bottom:2px solid transparent; }
  nav button.active{ color:var(--grntxt); border-bottom-color:var(--grn); }
  main{ padding:14px 18px; }
  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; color:var(--dim); font-weight:500; letter-spacing:1px; padding:8px 10px; border-bottom:1px solid var(--line); font-size:11px; }
  td{ padding:9px 10px; border-bottom:1px solid #141a13; vertical-align:top; }
  tr:hover td{ background:#0f140e; }
  .pill{ background:var(--grnpill); color:var(--grntxt); padding:2px 8px; border-radius:3px; font-size:12px; }
  .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; }
  .run .dot{ background:var(--grn); box-shadow:0 0 6px var(--grn); }
  .ok .dot{ background:#2b6f3c; } .would .dot{ background:var(--amber); } .failed .dot{ background:var(--red); }
  .kill{ color:var(--red); border:1px solid #3a1f1f; background:none; padding:1px 7px; border-radius:3px; cursor:pointer; font-size:11px; }
  .cfg{ display:grid; grid-template-columns:200px 1fr; gap:6px 18px; }
  .cfg .k{ color:var(--dim); } .cfg pre{ margin:0; color:var(--txt); white-space:pre-wrap; }
  .card{ border:1px solid var(--line); border-radius:6px; padding:14px 16px; margin-bottom:14px; background:var(--panel); }
  .card h3{ margin:0 0 10px; color:var(--grntxt); font-size:12px; letter-spacing:1px; font-weight:600; }
  .mode-shadow{ color:var(--amber); } .mode-autonomous{ color:var(--grntxt); }
  .empty{ color:var(--dim); padding:18px 10px; }
  .refresh{ background:none; border:1px solid var(--line); color:var(--dim); padding:3px 10px; border-radius:3px; cursor:pointer; }
  .badge{ background:var(--red); color:#fff; border-radius:9px; padding:0 6px; font-size:10px; margin-left:4px; }
  [hidden]{ display:none !important; }
  main{ height:calc(100vh - 96px); padding:0; }
  #chat{ display:flex; flex-direction:row; height:100%; }
  .convs{ width:240px; min-width:240px; border-right:1px solid var(--line); display:flex; flex-direction:column; padding:12px 10px; gap:3px; overflow-y:auto; }
  .newchat{ background:var(--grnpill); color:var(--grntxt); border:1px solid #1d3a2a; padding:9px; border-radius:6px; cursor:pointer; margin-bottom:10px; letter-spacing:1px; }
  .conv-h{ color:var(--dim); font-size:10px; letter-spacing:1px; padding:8px 8px 4px; }
  .convitem{ padding:8px 10px; border-radius:6px; cursor:pointer; color:var(--dim); display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .convitem:hover{ background:#0f140e; } .convitem.active{ background:#10241a; color:var(--txt); }
  .convitem .t{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .convmain{ flex:1; display:flex; flex-direction:column; min-width:0; padding:14px 24px; }
  .convtitle, #chatlog, .composer{ width:100%; max-width:880px; margin-left:auto; margin-right:auto; }
  .convitem .ar{ color:var(--dim); border:none; background:none; cursor:pointer; opacity:0; font-size:13px; }
  .convitem:hover .ar{ opacity:.7; } .convitem .ar:hover{ opacity:1; color:var(--amber); }
  .archtoggle{ color:var(--dim); background:none; border:none; cursor:pointer; font-size:11px; letter-spacing:1px; padding:8px; text-align:left; }
  .convtitle{ color:var(--grntxt); font-size:12px; letter-spacing:1px; padding-bottom:10px; border-bottom:1px solid var(--line); margin-bottom:12px; }
  #chatlog{ flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:4px 8px 4px 0; }
  #chatlog::-webkit-scrollbar{ width:8px; } #chatlog::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  .msg{ padding:9px 12px; border-radius:7px; max-width:78%; white-space:pre-wrap; }
  .msg.jarvis{ background:var(--panel); border:1px solid var(--line); align-self:flex-start; }
  .msg.owner{ background:#10241a; border:1px solid #1d3a2a; align-self:flex-end; }
  .msg .who{ color:var(--dim); font-size:10px; letter-spacing:1px; margin-bottom:3px; }
  .msg.q{ border-color:#3a3320; background:#1a1710; }
  .msg.q .who{ color:var(--amber); }
  .ansrow{ display:flex; gap:6px; margin-top:8px; }
  .ansrow input{ flex:1; }
  input{ background:#0c100c; border:1px solid var(--line); color:var(--txt); padding:7px 10px; border-radius:5px; font:inherit; }
  .composer{ display:flex; gap:8px; padding:12px 0 4px; margin-top:8px; border-top:1px solid var(--line); }
  .composer input{ flex:1; }
  .msg{ font-size:13px; }
  .send,.ansbtn{ background:var(--grnpill); color:var(--grntxt); border:1px solid #1d3a2a; padding:6px 14px; border-radius:5px; cursor:pointer; }
  #setup{ padding:20px 24px; overflow-y:auto; height:100%; }
  #setup .card{ max-width:680px; }
  #setup p{ color:var(--txt); }
  .setupdone{ color:var(--grntxt); font-size:15px; }
  ul.plan{ margin:10px 0 18px; padding-left:18px; } ul.plan li{ margin:6px 0; }
  .tag{ background:#3a3320; color:var(--amber); border-radius:3px; padding:1px 6px; font-size:10px; letter-spacing:1px; }
  .bigbtn{ background:var(--grn); color:#04140a; border:none; padding:12px 22px; border-radius:7px; cursor:pointer; font:inherit; font-weight:600; letter-spacing:1px; }
  .bigbtn:disabled{ opacity:.55; cursor:default; }
  .needyou{ margin-top:16px; border-top:1px solid var(--line); padding-top:12px; color:var(--amber); }
</style>
</head>
<body>
<header>
  <div class="title">● JARVIS</div>
  <div class="meta"><span id="procs">0 procs</span> · mode <span id="mode">—</span> · updated <span id="upd">—</span>
     <button type="button" class="refresh" onclick="load()">refresh</button></div>
</header>
<nav>
  <button type="button" id="tab-setup" onclick="show('setup')">SETUP <span id="setupbadge" class="badge" hidden></span></button>
  <button type="button" id="tab-chat" class="active" onclick="show('chat')">CHAT <span id="qbadge" class="badge" hidden></span></button>
  <button type="button" id="tab-runs" onclick="show('runs')">RUNS</button>
  <button type="button" id="tab-config" onclick="show('config')">CONFIG</button>
  <button type="button" id="tab-procs" onclick="show('procview')">PROCESSES</button>
</nav>
<main>
  <section id="setup" hidden></section>
  <section id="runs">
    <table><thead><tr><th>TIME</th><th>MODE</th><th>POOL</th><th>MODEL</th><th>STATUS</th><th>DURATION</th><th>TARGET</th></tr></thead>
    <tbody id="runs-body"></tbody></table>
    <div id="runs-empty" class="empty" hidden>No runs yet — run <code>./install.sh breathe</code>.</div>
  </section>
  <section id="chat" hidden>
    <aside class="convs">
      <button type="button" class="newchat" onclick="newChat()">+ New chat</button>
      <div class="conv-h">CONVERSATIONS</div>
      <div id="convlist"></div>
    </aside>
    <div class="convmain">
      <div id="convtitle" class="convtitle">—</div>
      <div id="chatlog"></div>
      <div class="composer"><input id="sayinput" placeholder="message Jarvis…" onkeydown="if(event.key==='Enter')say()"/>
        <button type="button" class="send" onclick="say()">send</button></div>
    </div>
  </section>
  <section id="config" hidden></section>
  <section id="procview" hidden>
    <table><thead><tr><th>PID</th><th>UPTIME</th><th>COMMAND</th><th></th></tr></thead>
    <tbody id="procs-body"></tbody></table>
    <div id="procs-empty" class="empty" hidden>No live Jarvis processes.</div>
  </section>
</main>
<script>
function show(id){
  for(const s of ['setup','runs','chat','config','procview']){ document.getElementById(s).hidden = (s!==id); }
  for(const b of document.querySelectorAll('nav button')) b.classList.remove('active');
  document.getElementById('tab-'+(id==='procview'?'procs':id)).classList.add('active');
}
function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function statusClass(s){ return ({Running:'run',running:'run',ok:'ok',would:'would',failed:'failed'})[s]||'ok'; }
let booted=false;
function renderSetup(s){
  const el=document.getElementById('setup'), badge=document.getElementById('setupbadge'), tab=document.getElementById('tab-setup');
  if(s.error){ el.innerHTML='<div class="card"><h3>SETUP</h3><div class="empty">'+esc(s.error)+'</div></div>'; return; }
  if(s.complete){
    badge.hidden=true; tab.hidden=true;                          // setup done -> the tab disappears
    if(!document.getElementById('setup').hidden) show('chat');   // don't strand the user on a hidden tab
    el.innerHTML='<div class="card"><h3>SETUP</h3><div class="setupdone">✓ Jarvis is set up and running.</div></div>';
    return;
  }
  tab.hidden=false; badge.hidden=false; badge.textContent='!';
  const plan=s.plan||[], doable=plan.filter(a=>!a.blocked), blocked=plan.filter(a=>a.blocked), needs=s.needs_user||[];
  let h='<div class="card"><h3>SET UP JARVIS</h3>';
  if(doable.length){
    h+='<p>Jarvis needs to set up '+doable.length+' thing'+(doable.length>1?'s':'')+' on this computer:</p><ul class="plan">';
    for(const a of doable) h+='<li>'+esc(a.desc)+(a.needs_sudo?' <span class="tag">admin</span>':'')+'</li>';
    h+='</ul><button type="button" class="bigbtn" onclick="approve()"'+(s.running?' disabled':'')+'>'+(s.running?'Installing…':'Approve &amp; Install')+'</button>';
  } else if(!blocked.length && !needs.length){ h+='<p>Finishing up…</p>'; }
  if(needs.length){
    h+='<div class="needyou"><b>Your turn:</b><ul class="plan">';
    for(const n of needs) h+='<li>'+esc(n.desc)+'</li>';
    h+='</ul></div>';
  }
  if(blocked.length){
    h+='<div class="needyou"><b>Needs your help:</b><ul class="plan">';
    for(const a of blocked) h+='<li>'+esc(a.desc)+' — '+esc(a.blocked_reason)+'</li>';
    h+='</ul></div>';
  }
  el.innerHTML=h+'</div>';
}
async function approve(){
  const s=await fetch('/api/setup').then(r=>r.json());
  const ids=(s.plan||[]).filter(a=>!a.blocked).map(a=>a.id);
  await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})});
  load();
}
async function load(){
  const [runs,cfg,procs,convs,setup] = await Promise.all([
    fetch('/api/runs').then(r=>r.json()), fetch('/api/config').then(r=>r.json()),
    fetch('/api/procs').then(r=>r.json()), fetch('/api/conversations').then(r=>r.json()),
    fetch('/api/setup').then(r=>r.json())]);
  renderSetup(setup);
  if(!booted){ booted=true; show(setup.complete?'chat':'setup'); }
  if(!activeConv && convs.length) activeConv = convs[0].id;
  const msgs = activeConv ? await fetch('/api/messages?conv='+encodeURIComponent(activeConv)).then(r=>r.json()) : [];
  // conversations sidebar
  const clist=document.getElementById('convlist'); clist.innerHTML='';
  const active=convs.filter(c=>!c.archived), archived=convs.filter(c=>c.archived);
  const item=(c,isArch)=>{
    const act=c.id===activeConv?' active':'';
    const badge=c.open_q?`<span class="badge">${c.open_q}</span>`:'';
    const btn=isArch?`<button type="button" class="ar" title="unarchive" onclick="event.stopPropagation();archiveConv('${c.id}',false)">⤴</button>`
                    :`<button type="button" class="ar" title="archive" onclick="event.stopPropagation();archiveConv('${c.id}',true)">×</button>`;
    return `<div class="convitem${act}" onclick="selectConv('${c.id}')"><span class="t">${esc(c.title)}</span><span>${badge}${btn}</span></div>`;
  };
  for(const c of active) clist.insertAdjacentHTML('beforeend', item(c,false));
  if(archived.length){
    clist.insertAdjacentHTML('beforeend', `<button type="button" class="archtoggle" onclick="toggleArch()">${showArch?'▾':'▸'} ARCHIVED (${archived.length})</button>`);
    if(showArch) for(const c of archived) clist.insertAdjacentHTML('beforeend', item(c,true));
  }
  document.getElementById('convtitle').textContent = activeConv ? (convs.find(c=>c.id===activeConv)?.title||activeConv) : 'New conversation';
  // runs
  const rb=document.getElementById('runs-body'); rb.innerHTML='';
  document.getElementById('runs-empty').hidden = runs.length>0;
  for(const r of runs){
    const cls=statusClass(r.status);
    rb.insertAdjacentHTML('beforeend',
     `<tr class="${cls}"><td>${(r.ts||'').replace('T',' ')}</td>`+
     `<td><span class="pill">${r.mode||''}</span></td><td>${r.pool||''}</td><td>${r.model||''}</td>`+
     `<td><span class="dot"></span>${r.status||''}</td><td>${r.duration??'—'}</td><td>${r.target||''}</td></tr>`);
  }
  // config
  const cs=document.getElementById('config'); cs.innerHTML='';
  const c=(cfg.config)||{}; const idn=c.identity||{};
  document.getElementById('mode').textContent=idn.mode||'—';
  document.getElementById('mode').className='mode-'+(idn.mode||'');
  const card=(title,inner)=>`<div class="card"><h3>${title}</h3>${inner}</div>`;
  const kv=o=>'<div class="cfg">'+Object.entries(o||{}).map(([k,v])=>
     `<div class="k">${k}</div><pre>${typeof v==='object'?JSON.stringify(v,null,2):v}</pre>`).join('')+'</div>';
  cs.innerHTML = card('IDENTITY', kv(idn))
    + card('ACTION CLASSES (what it may do without asking)', kv(c.action_classes))
    + card('LLM ROUTING (role → model)', kv((c.llm||{}).routing))
    + card('PRIORITY LADDER', '<pre>'+(c.priorities||[]).map((p,i)=>`${i}. ${p}`).join('\n')+'</pre>')
    + card('MEMORY / NOTIFIER / WORKSOURCE', kv({memory:c.memory,notifier:c.notifier,worksource:c.worksource}));
  // procs
  const pb=document.getElementById('procs-body'); pb.innerHTML='';
  document.getElementById('procs').textContent=procs.length+' procs';
  document.getElementById('procs-empty').hidden = procs.length>0;
  for(const p of procs){
    pb.insertAdjacentHTML('beforeend',
     `<tr class="run"><td><span class="dot"></span>${p.pid}</td><td>${p.etime}</td><td>${p.cmd}</td>`+
     `<td><button class="kill" onclick="kill('${p.pid}')">kill</button></td></tr>`);
  }
  // chat
  const cl=document.getElementById('chatlog');
  const nearBottom = cl.scrollHeight - cl.scrollTop - cl.clientHeight < 80;
  cl.innerHTML='';
  let openQ=0;
  for(const m of msgs){
    const isJ = m.from==='jarvis'; const isQ = m.kind==='question';
    if(isQ && !m.answered) openQ++;
    let html=`<div class="msg ${isJ?'jarvis':'owner'} ${isQ?'q':''}">`+
      `<div class="who">${isJ?'JARVIS':'YOU'}${isQ?' · QUESTION':''} · ${(m.ts||'').replace('T',' ')}</div>${esc(m.text)}`;
    if(isQ && !m.answered){
      html+=`<div class="ansrow"><input id="a-${m.id}" placeholder="answer…" onkeydown="if(event.key==='Enter')answerQ('${m.id}')"/>`+
            `<button type="button" class="ansbtn" onclick="answerQ('${m.id}')">answer</button></div>`;
    } else if(isQ && m.answered){ html+=`<div class="who" style="margin-top:6px">answered: ${esc(m.answer)}</div>`; }
    html+='</div>'; cl.insertAdjacentHTML('beforeend',html);
  }
  const totalOpen = convs.reduce((s,c)=>s+(c.open_q||0),0);
  const badge=document.getElementById('qbadge');
  badge.hidden = totalOpen===0; badge.textContent = totalOpen;
  if(nearBottom) cl.scrollTop = cl.scrollHeight;
  document.getElementById('upd').textContent=new Date().toLocaleTimeString();
}
async function kill(pid){ await fetch('/api/kill?pid='+pid); load(); }
async function answerQ(id){
  const v=document.getElementById('a-'+id).value.trim(); if(!v) return;
  await fetch('/api/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,text:v})}); load();
}
let showArch=false;
function toggleArch(){ showArch=!showArch; load(); }
async function archiveConv(id,val){
  await fetch('/api/archive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conv:id,archived:val})});
  if(activeConv===id && val) activeConv=null;
  load();
}
function selectConv(id){ activeConv=id; load(); }
function newChat(){ activeConv='chat-'+Date.now().toString(36); document.getElementById('chatlog').innerHTML=''; document.getElementById('convtitle').textContent='New conversation'; show('chat'); }
async function say(){
  const el=document.getElementById('sayinput'); const v=el.value.trim(); if(!v) return; el.value='';
  await fetch('/api/say',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:v,conv:activeConv||'general'})}); load();
}
let activeConv=null;
load(); setInterval(load, 4000);
</script>
</body>
</html>
